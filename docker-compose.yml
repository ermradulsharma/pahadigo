version: '3.8'

services:
  pahadigo-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pahadigo-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb:27017/pahadigo
      # Add other necessary env vars from your .env here
    depends_on:
      - mongodb
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: pahadigo-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  mongodb_data:
